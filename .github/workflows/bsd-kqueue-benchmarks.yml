name: BSD kqueue, tests, and benchmarks

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cwist-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bsd-kqueue:
    name: kqueue tests (macOS)
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: brew install cmake pkg-config curl nghttp2 brotli
      - name: Verify kqueue backend and focused suite
        env:
          # AppleClang does not implement GCC's -ffat-lto-objects option.
          PERF_STACK_FLAGS: -O3 -march=native -mtune=native -pipe -flto -fomit-frame-pointer -funroll-loops -fstrict-aliasing -ffunction-sections -fdata-sections -fvisibility=hidden -DNDEBUG
          PKG_CONFIG_PATH: /opt/homebrew/opt/curl/lib/pkgconfig
        run: |
          make test_seq test_http_chunked test_mux test_test_client
          make -pn | grep -E '^IO_SRC[[:space:]]*=[[:space:]]*src/sys/io/kqueue\.c$'

  benchmark:
    name: benchmark (${{ matrix.os }})
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev libnghttp2-dev libbrotli-dev
      - if: runner.os == 'macOS'
        run: brew install cmake pkg-config curl nghttp2 brotli
      - env:
          # AppleClang does not implement GCC's -ffat-lto-objects option.
          PERF_STACK_FLAGS: ${{ runner.os == 'macOS' && '-O3 -march=native -mtune=native -pipe -flto -fomit-frame-pointer -funroll-loops -fstrict-aliasing -ffunction-sections -fdata-sections -fvisibility=hidden -DNDEBUG' || '' }}
          PKG_CONFIG_PATH: ${{ runner.os == 'macOS' && format('{0}/lib/pkgconfig', '/opt/homebrew/opt/curl') || '' }}
        run: python3 scripts/ci/benchmark.py measure > benchmark-${{ runner.os }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ runner.os }}
          path: benchmark-${{ runner.os }}.json

  web-server-benchmark:
    name: web server benchmark (CWIST vs Axum vs Spring vs Gin)
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Set up Rust & Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install dependencies & wrk
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev libnghttp2-dev libbrotli-dev wrk maven
      - name: Generate inline web server code & run HTTP benchmark
        run: |
          # 1. CWIST Minimal HTTP Web Server
          cat << 'EOF' > /tmp/cwist_server.c
          #include <cwist/app.h>
          static void handle_root(cwist_http_request *req, cwist_http_response *res) {
              (void)req;
              cwist_sstring_assign(res->body, "Hello, World!");
          }
          int main(void) {
              cwist_app *app = cwist_app_create();
              cwist_app_get_opt(app, "/", handle_root, CWIST_ENDPOINT_FIXED);
              cwist_app_listen(app, 9091);
              cwist_app_destroy(app);
              return 0;
          }
          EOF

          # 2. Axum Minimal HTTP Web Server
          mkdir -p /tmp/axum_bench && cd /tmp/axum_bench
          cat << 'EOF' > Cargo.toml
          [package]
          name = "axum_server"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          axum = "0.7"
          tokio = { version = "1.0", features = ["full"] }
          EOF
          mkdir -p src
          cat << 'EOF' > src/main.rs
          use axum::{routing::get, Router};

          #[tokio::main]
          async fn main() {
              let app = Router::new().route("/", get(|| async { "Hello, World!" }));
              let listener = tokio::net::TcpListener::bind("127.0.0.1:9092").await.unwrap();
              axum::serve(listener, app).await.unwrap();
          }
          EOF

          # 3. Gin (Go) Minimal HTTP Web Server
          mkdir -p /tmp/gin_bench && cd /tmp/gin_bench
          cat << 'EOF' > go.mod
          module gin_server

          go 1.22

          require github.com/gin-gonic/gin v1.10.0
          EOF
          cat << 'EOF' > main.go
          package main

          import "github.com/gin-gonic/gin"

          func main() {
              gin.SetMode(gin.ReleaseMode)
              r := gin.New()
              r.GET("/", func(c *gin.Context) { c.String(200, "Hello, World!") })
              r.Run("127.0.0.1:9094")
          }
          EOF

          # 4. Spring Boot Minimal HTTP Web Server
          mkdir -p /tmp/spring_bench && cd /tmp/spring_bench
          cat << 'EOF' > pom.xml
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>com.example</groupId>
              <artifactId>spring-bench</artifactId>
              <version>0.0.1-SNAPSHOT</version>
              <parent>
                  <groupId>org.springframework.boot</groupId>
                  <artifactId>spring-boot-starter-parent</artifactId>
                  <version>3.2.3</version>
              </parent>
              <dependencies>
                  <dependency>
                      <groupId>org.springframework.boot</groupId>
                      <artifactId>spring-boot-starter-webflux</artifactId>
                  </dependency>
              </dependencies>
              <build>
                  <plugins>
                      <plugin>
                          <groupId>org.springframework.boot</groupId>
                          <artifactId>spring-boot-maven-plugin</artifactId>
                      </plugin>
                  </plugins>
              </build>
          </project>
          EOF
          # Spring WebFlux runs on the Reactor Netty event loop, and virtual
          # threads are disabled since the hello world handler is non-blocking,
          # avoiding unnecessary Loom career thread context-switching overhead.
          mkdir -p src/main/java/com/example src/main/resources
          cat << 'EOF' > src/main/resources/application.properties
          spring.threads.virtual.enabled=false
          EOF
          cat << 'EOF' > src/main/java/com/example/Application.java
          package com.example;
          import org.springframework.boot.SpringApplication;
          import org.springframework.boot.autoconfigure.SpringBootApplication;
          import org.springframework.web.bind.annotation.GetMapping;
          import org.springframework.web.bind.annotation.RestController;

          @SpringBootApplication
          @RestController
          public class Application {
              @GetMapping("/")
              public String hello() { return "Hello, World!"; }

              public static void main(String[] args) {
                  SpringApplication.run(Application.class, args);
              }
          }
          EOF

          # Build servers
          cd $GITHUB_WORKSPACE
          make
          gcc -O3 -I./include -I./lib -I./lib/libttak/include -o /tmp/cwist_server /tmp/cwist_server.c libcwist.a -pthread -ldl -lm -lstdc++ -lz -lzstd lib/lsquic/build/src/liblsquic/liblsquic.a lib/boringssl/build/libssl.a lib/boringssl/build/libcrypto.a -lcurl -lnghttp2 -lbrotlienc -lbrotlicommon -lbrotlidec

          cd /tmp/axum_bench && cargo build --release
          cd /tmp/gin_bench && go mod tidy && go build -o gin_server .
          cd /tmp/spring_bench && mvn -q package -DskipTests

          # Helper function for process stats before/after wrk test.
          # Every server gets an identical 10s warmup run (discarded) before the
          # measured run so JIT-tiered runtimes (JVM) reach steady state; context
          # switches are only counted over the measured window.
          run_bench() {
            NAME=$1
            CMD=$2
            PORT=$3
            TXT=$4
            STAT_TXT=$5
            WAIT=${6:-2}

            echo "=== Starting $NAME Web Server (Port $PORT) ==="
            $CMD &
            PID=$!
            for i in $(seq 1 $WAIT); do
              curl -sf http://127.0.0.1:$PORT/ > /dev/null 2>&1 && break
              sleep 1
            done

            # Warmup (results discarded)
            wrk -t12 -c400 -d10s http://127.0.0.1:$PORT/ > /dev/null 2>&1 || true

            # Initial stat (after warmup)
            BEFORE_CSW=$(ps -o nvcsw=,nivcsw= -p $PID 2>/dev/null | awk '{print $1+$2}')
            [ -z "$BEFORE_CSW" ] && BEFORE_CSW=0

            wrk -t12 -c400 -d10s http://127.0.0.1:$PORT/ > $TXT 2>&1 || true

            AFTER_CSW=$(ps -o nvcsw=,nivcsw= -p $PID 2>/dev/null | awk '{print $1+$2}')
            [ -z "$AFTER_CSW" ] && AFTER_CSW=0
            RSS=$(ps -o rss= -p $PID 2>/dev/null | awk '{print $1}')
            [ -z "$RSS" ] && RSS=0

            CSW=$((AFTER_CSW - BEFORE_CSW))
            [ $CSW -lt 0 ] && CSW=0

            kill -9 $PID || true
            echo "rss_kib=$RSS csw=$CSW" > $STAT_TXT
            cat $TXT
          }

          run_bench "CWIST" "/tmp/cwist_server" 9091 "/tmp/cwist.txt" "/tmp/cwist_stat.txt" 10
          run_bench "Axum" "/tmp/axum_bench/target/release/axum_server" 9092 "/tmp/axum.txt" "/tmp/axum_stat.txt" 10
          run_bench "Gin" "/tmp/gin_bench/gin_server" 9094 "/tmp/gin.txt" "/tmp/gin_stat.txt" 10

          # Spring Boot JVM optimal tuning:
          #  - 1024m heap to reduce GC collection pressure
          #  - UseParallelGC for absolute highest throughput on simple benchmarks
          #  - AlwaysPreTouch to avoid page faults during measurement
          #  - Pooled bytebufs and disabled Netty leak detection for peak Netty performance
          #  - CDS (Class Data Sharing) AOT cache trained from a real boot, then
          #    replayed via -XX:SharedArchiveFile for representative startup/warmup
          SPRING_JVM_OPTS="-Xms1024m -Xmx1024m -XX:+UseParallelGC -XX:+AlwaysPreTouch -Djava.net.preferIPv4Stack=true -Dio.netty.allocator.type=pooled -Dio.netty.leakDetection.level=disabled"
          SPRING_CDS_ARCHIVE=/tmp/spring_bench/app.jsa

          java $SPRING_JVM_OPTS -XX:ArchiveClassesAtExit=$SPRING_CDS_ARCHIVE \
            -jar /tmp/spring_bench/target/spring-bench-0.0.1-SNAPSHOT.jar --server.port=9093 &
          TRAIN_PID=$!
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:9093/ > /dev/null 2>&1 && break
            sleep 1
          done
          kill -TERM $TRAIN_PID 2>/dev/null || true
          wait $TRAIN_PID 2>/dev/null || true

          run_bench "Spring Boot" "java $SPRING_JVM_OPTS -XX:SharedArchiveFile=$SPRING_CDS_ARCHIVE -jar /tmp/spring_bench/target/spring-bench-0.0.1-SNAPSHOT.jar --server.port=9093" 9093 "/tmp/spring.txt" "/tmp/spring_stat.txt" 90

          # Result JSON must land in the workspace so upload-artifact can find it
          # (the shell is still sitting in /tmp/spring_bench from the maven build).
          cd $GITHUB_WORKSPACE

          # Record exact toolchain/runtime facts alongside the numbers
          export RUNNER_HW="$(nproc) vCPU | $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)"
          export SPRING_JAVA_VERSION="$(java -version 2>&1 | head -1)"
          export SPRING_BOOT_VERSION="3.2.3"
          export SPRING_STACK="Spring WebFlux + Reactor Netty (optimized event loop, virtual threads disabled)"
          export SPRING_JVM_OPTS_RECORDED="$SPRING_JVM_OPTS -XX:SharedArchiveFile=$SPRING_CDS_ARCHIVE (CDS AOT cache)"
          export SPRING_VIRTUAL_THREADS="false"
          export GO_VERSION_RECORDED="$(go version)"
          export GIN_FRAMEWORK="Gin v1.10.0 (gin-gonic/gin, release mode)"
          export WRK_PROFILE="wrk -t12 -c400 -d10s (after 10s warmup, warmup discarded)"

          python3 - <<'PY'
          import json, os, re, pathlib
          from datetime import datetime, timezone

          def parse_wrk(path_str):
              p = pathlib.Path(path_str)
              text = p.read_text() if p.exists() else ""
              rps = 0.0
              lat_ms = 0.0
              m_rps = re.search(r"Requests/sec:\s+([0-9.]+)", text)
              if m_rps:
                  rps = float(m_rps.group(1))
              m_lat = re.search(r"Latency\s+([0-9.]+)(us|ms|s)", text)
              if m_lat:
                  val = float(m_lat.group(1))
                  unit = m_lat.group(2)
                  if unit == "us": lat_ms = val / 1000.0
                  elif unit == "ms": lat_ms = val
                  elif unit == "s": lat_ms = val * 1000.0
              return rps, lat_ms

          def parse_stat(path_str):
              p = pathlib.Path(path_str)
              text = p.read_text() if p.exists() else ""
              rss = 0.0
              csw = 0.0
              m_rss = re.search(r"rss_kib=([0-9]+)", text)
              if m_rss: rss = float(m_rss.group(1))
              m_csw = re.search(r"csw=([0-9]+)", text)
              if m_csw: csw = float(m_csw.group(1))
              return rss, csw

          cwist_rps, cwist_lat = parse_wrk("/tmp/cwist.txt")
          cwist_rss, cwist_csw = parse_stat("/tmp/cwist_stat.txt")

          axum_rps, axum_lat = parse_wrk("/tmp/axum.txt")
          axum_rss, axum_csw = parse_stat("/tmp/axum_stat.txt")

          gin_rps, gin_lat = parse_wrk("/tmp/gin.txt")
          gin_rss, gin_csw = parse_stat("/tmp/gin_stat.txt")

          spring_rps, spring_lat = parse_wrk("/tmp/spring.txt")
          spring_rss, spring_csw = parse_stat("/tmp/spring_stat.txt")

          data = {
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "cwist_rps": cwist_rps, "cwist_lat_ms": cwist_lat, "cwist_rss_kib": cwist_rss, "cwist_csw": cwist_csw,
              "axum_rps": axum_rps, "axum_lat_ms": axum_lat, "axum_rss_kib": axum_rss, "axum_csw": axum_csw,
              "gin_rps": gin_rps, "gin_lat_ms": gin_lat, "gin_rss_kib": gin_rss, "gin_csw": gin_csw,
              "spring_rps": spring_rps, "spring_lat_ms": spring_lat, "spring_rss_kib": spring_rss, "spring_csw": spring_csw,
              "wrk_profile": os.environ.get("WRK_PROFILE", ""),
              "runner_hw": os.environ.get("RUNNER_HW", ""),
              "go_env": {
                  "go_version": os.environ.get("GO_VERSION_RECORDED", ""),
                  "framework": os.environ.get("GIN_FRAMEWORK", "")
              },
              "spring_env": {
                  "java_version": os.environ.get("SPRING_JAVA_VERSION", ""),
                  "spring_boot_version": os.environ.get("SPRING_BOOT_VERSION", ""),
                  "stack": os.environ.get("SPRING_STACK", ""),
                  "jvm_opts": os.environ.get("SPRING_JVM_OPTS_RECORDED", ""),
                  "virtual_threads": os.environ.get("SPRING_VIRTUAL_THREADS", "") == "true",
                  "aot_cache": "CDS (-XX:ArchiveClassesAtExit training run + -XX:SharedArchiveFile replay)"
              }
          }
          print("Parsed web server multi-metric benchmark data:", data)
          with open("webserver-result.json", "w") as f:
              json.dump(data, f)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: webserver-result
          path: webserver-result.json

  publish-benchmark-report:
    needs: [bsd-kqueue, benchmark, web-server-benchmark]
    if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download webserver-result
        uses: actions/download-artifact@v4
        with:
          name: webserver-result
          path: artifacts
      - name: Download benchmark-Linux
        uses: actions/download-artifact@v4
        with:
          name: benchmark-Linux
          path: artifacts
      - name: Download benchmark-macOS
        uses: actions/download-artifact@v4
        with:
          name: benchmark-macOS
          path: artifacts
      - name: Update benchmark history and English SVG report
        run: |
          mkdir -p benchmarks
          echo "=== Artifacts Directory Content ==="
          ls -laR artifacts || true
          echo "=== Current Directory Content ==="
          ls -la || true
          python3 - <<'PY'
          import glob, json
          from pathlib import Path
          path = Path('benchmarks/db.json')
          history = json.loads(path.read_text()) if path.exists() else []
          history.extend(json.load(open(f)) for f in glob.glob('artifacts/benchmark-*.json') + glob.glob('benchmark-*.json'))
          path.write_text(json.dumps(history[-100:], indent=2) + '\n')

          ws_path = Path('benchmarks/webserver.json')
          ws_history = json.loads(ws_path.read_text()) if ws_path.exists() else []
          # Filter out previous erroneous zero entries
          ws_history = [x for x in ws_history if x.get("cwist_rps", 0) > 0 or x.get("axum_rps", 0) > 0]
          
          ws_files = glob.glob('artifacts/webserver-result*.json') + glob.glob('artifacts/**/webserver-result*.json', recursive=True) + glob.glob('webserver-result*.json') + glob.glob('**/webserver-result*.json', recursive=True)
          print("Found webserver result files:", ws_files)
          for f in set(ws_files):
              try:
                  data = json.load(open(f))
                  print("Loaded data from", f, ":", data)
                  ws_history.append(data)
              except Exception as e:
                  print(f"Error reading {f}: {e}")
          ws_path.write_text(json.dumps(ws_history[-100:], indent=2) + '\n')
          PY
          python3 scripts/ci/benchmark.py render
      - name: Commit generated benchmark documentation
        run: |
          git config user.name "cwist-ci[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README README.md ROADMAP.md benchmarks/db.json benchmarks/webserver.json docs/benchmark-trends.svg docs/webserver-benchmark-trends.svg
          git diff --cached --quiet || git commit -m "docs(ci): update benchmark report [skip ci]"
          git push
