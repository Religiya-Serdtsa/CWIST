name: BSD kqueue, tests, and benchmarks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cwist-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bsd-kqueue:
    name: kqueue tests (macOS)
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: brew install cmake pkg-config curl nghttp2 brotli
      - name: Verify kqueue backend and focused suite
        env:
          # AppleClang does not implement GCC's -ffat-lto-objects option.
          PERF_STACK_FLAGS: -O3 -march=native -mtune=native -pipe -flto -fomit-frame-pointer -funroll-loops -fstrict-aliasing -ffunction-sections -fdata-sections -fvisibility=hidden -DNDEBUG
          PKG_CONFIG_PATH: /opt/homebrew/opt/curl/lib/pkgconfig
        run: |
          make test_seq test_http_chunked test_mux test_test_client
          make -pn | grep -E '^IO_SRC[[:space:]]*=[[:space:]]*src/sys/io/kqueue\.c$'

  benchmark:
    name: benchmark (${{ matrix.os }})
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev libnghttp2-dev libbrotli-dev
      - if: runner.os == 'macOS'
        run: brew install cmake pkg-config curl nghttp2 brotli
      - env:
          # AppleClang does not implement GCC's -ffat-lto-objects option.
          PERF_STACK_FLAGS: ${{ runner.os == 'macOS' && '-O3 -march=native -mtune=native -pipe -flto -fomit-frame-pointer -funroll-loops -fstrict-aliasing -ffunction-sections -fdata-sections -fvisibility=hidden -DNDEBUG' || '' }}
          PKG_CONFIG_PATH: ${{ runner.os == 'macOS' && format('{0}/lib/pkgconfig', '/opt/homebrew/opt/curl') || '' }}
        run: python3 scripts/ci/benchmark.py measure > benchmark-${{ runner.os }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ runner.os }}
          path: benchmark-${{ runner.os }}.json

  web-server-benchmark:
    name: web server benchmark (CWIST vs Axum vs Spring)
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Set up Rust & Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install dependencies & wrk
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev libnghttp2-dev libbrotli-dev wrk maven
      - name: Generate inline web server code & run HTTP benchmark
        run: |
          # 1. CWIST Minimal HTTP Web Server
          cat << 'EOF' > /tmp/cwist_server.c
          #include <cwist/app.h>
          static void handle_root(cwist_http_request *req, cwist_http_response *res) {
              (void)req;
              cwist_sstring_assign(res->body, "Hello, World!");
          }
          int main(void) {
              cwist_app *app = cwist_app_create();
              cwist_app_get(app, "/", handle_root);
              cwist_app_listen(app, 8081);
              cwist_app_destroy(app);
              return 0;
          }
          EOF

          # 2. Axum Minimal HTTP Web Server
          mkdir -p /tmp/axum_bench && cd /tmp/axum_bench
          cat << 'EOF' > Cargo.toml
          [package]
          name = "axum_server"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          axum = "0.7"
          tokio = { version = "1.0", features = ["full"] }
          EOF
          mkdir -p src
          cat << 'EOF' > src/main.rs
          use axum::{routing::get, Router};

          #[tokio::main]
          async fn main() {
              let app = Router::new().route("/", get(|| async { "Hello, World!" }));
              let listener = tokio::net::TcpListener::bind("127.0.0.1:8082").await.unwrap();
              axum::serve(listener, app).await.unwrap();
          }
          EOF

          # 3. Spring Boot Minimal HTTP Web Server
          mkdir -p /tmp/spring_bench && cd /tmp/spring_bench
          cat << 'EOF' > pom.xml
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>com.example</groupId>
              <artifactId>spring-bench</artifactId>
              <version>0.0.1-SNAPSHOT</version>
              <parent>
                  <groupId>org.springframework.boot</groupId>
                  <artifactId>spring-boot-starter-parent</artifactId>
                  <version>3.2.3</version>
              </parent>
              <dependencies>
                  <dependency>
                      <groupId>org.springframework.boot</groupId>
                      <artifactId>spring-boot-starter-web</artifactId>
                  </dependency>
              </dependencies>
              <build>
                  <plugins>
                      <plugin>
                          <groupId>org.springframework.boot</groupId>
                          <artifactId>spring-boot-maven-plugin</artifactId>
                      </plugin>
                  </plugins>
              </build>
          </project>
          EOF
          mkdir -p src/main/java/com/example
          cat << 'EOF' > src/main/java/com/example/Application.java
          package com.example;
          import org.springframework.boot.SpringApplication;
          import org.springframework.boot.autoconfigure.SpringBootApplication;
          import org.springframework.web.bind.annotation.GetMapping;
          import org.springframework.web.bind.annotation.RestController;

          @SpringBootApplication
          @RestController
          public class Application {
              @GetMapping("/")
              public String hello() { return "Hello, World!"; }

              public static void main(String[] args) {
                  SpringApplication.run(Application.class, args);
              }
          }
          EOF

          # Build servers
          cd $GITHUB_WORKSPACE
          make
          gcc -O3 -I./include -I./lib -I./lib/libttak/include -o /tmp/cwist_server /tmp/cwist_server.c libcwist.a -pthread -ldl -lm -lstdc++ -lz -lzstd lib/lsquic/build/src/liblsquic/liblsquic.a lib/boringssl/build/libssl.a lib/boringssl/build/libcrypto.a -lcurl -lnghttp2 -lbrotlienc -lbrotlicommon -lbrotlidec

          cd /tmp/axum_bench && cargo build --release
          cd /tmp/spring_bench && mvn -q package -DskipTests

          # Execute RPS benchmark with wrk (12 threads, 400 connections, 10 seconds)
          echo "=== Starting CWIST Web Server (Port 8081) ==="
          /tmp/cwist_server &
          PID_CWIST=$!
          sleep 2
          wrk -t12 -c400 -d10s http://127.0.0.1:8081/ > /tmp/cwist.txt 2>&1 || true
          kill -9 $PID_CWIST || true
          cat /tmp/cwist.txt

          echo "=== Starting Axum Web Server (Port 8082) ==="
          /tmp/axum_bench/target/release/axum_server &
          PID_AXUM=$!
          sleep 2
          wrk -t12 -c400 -d10s http://127.0.0.1:8082/ > /tmp/axum.txt 2>&1 || true
          kill -9 $PID_AXUM || true
          cat /tmp/axum.txt

          echo "=== Starting Spring Boot Web Server (Port 8080) ==="
          java -jar /tmp/spring_bench/target/spring-bench-0.0.1-SNAPSHOT.jar &
          PID_SPRING=$!
          sleep 5
          wrk -t12 -c400 -d10s http://127.0.0.1:8080/ > /tmp/spring.txt 2>&1 || true
          kill -9 $PID_SPRING || true
          cat /tmp/spring.txt

          python3 - <<'PY'
          import json, re, pathlib
          from datetime import datetime, timezone

          def parse_rps(path_str):
              p = pathlib.Path(path_str)
              text = p.read_text() if p.exists() else ""
              m = re.search(r"Requests/sec:\s+([0-9.]+)", text)
              return float(m.group(1)) if m else 0.0

          data = {
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "cwist_rps": parse_rps("/tmp/cwist.txt"),
              "axum_rps": parse_rps("/tmp/axum.txt"),
              "spring_rps": parse_rps("/tmp/spring.txt")
          }
          print("Parsed web server benchmark data:", data)
          with open("webserver-result.json", "w") as f:
              json.dump(data, f)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: webserver-result
          path: webserver-result.json

  publish-benchmark-report:
    needs: [bsd-kqueue, benchmark, web-server-benchmark]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Update benchmark history and English SVG report
        run: |
          mkdir -p benchmarks
          echo "=== Artifacts Directory Content ==="
          ls -laR artifacts || true
          python3 - <<'PY'
          import glob, json
          from pathlib import Path
          path = Path('benchmarks/db.json')
          history = json.loads(path.read_text()) if path.exists() else []
          history.extend(json.load(open(f)) for f in glob.glob('artifacts/benchmark-*.json'))
          path.write_text(json.dumps(history[-100:], indent=2) + '\n')

          ws_path = Path('benchmarks/webserver.json')
          ws_history = json.loads(ws_path.read_text()) if ws_path.exists() else []
          # Filter out previous erroneous zero entries
          ws_history = [x for x in ws_history if x.get("cwist_rps", 0) > 0 or x.get("axum_rps", 0) > 0]
          
          ws_files = glob.glob('artifacts/webserver-result*.json') + glob.glob('artifacts/**/webserver-result*.json', recursive=True) + glob.glob('webserver-result*.json')
          print("Found webserver result files:", ws_files)
          for f in set(ws_files):
              try:
                  data = json.load(open(f))
                  print("Loaded data from", f, ":", data)
                  ws_history.append(data)
              except Exception as e:
                  print(f"Error reading {f}: {e}")
          ws_path.write_text(json.dumps(ws_history[-100:], indent=2) + '\n')
          PY
          python3 scripts/ci/benchmark.py render
      - name: Commit generated benchmark documentation
        run: |
          git config user.name "cwist-ci[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README README.md ROADMAP.md benchmarks/db.json benchmarks/webserver.json docs/benchmark-trends.svg docs/webserver-benchmark-trends.svg
          git diff --cached --quiet || git commit -m "docs(ci): update benchmark report [skip ci]"
          git push
