<svg xmlns="http://www.w3.org/2000/svg" width="680" height="580" viewBox="0 0 680 580"><style>.title{font:16px sans-serif;font-weight:bold;fill:#f3f4f6}.subtitle{font:13px sans-serif;font-weight:600;fill:#e5e7eb}.legend{font:11px sans-serif;font-weight:500}.axis{stroke:#374151}.series{fill:none;stroke-width:2}</style><rect width="100%" height="100%" fill="#111827"/><text x="40" y="30" class="title">Web Server Benchmark Comparison (CWIST vs Axum vs Spring Boot)</text><text x="40" y="60" class="subtitle">Throughput (Requests/sec - Higher is better)</text><line x1="40" y1="125" x2="640" y2="125" class="axis"/><polyline points="40,80.0" stroke="#22c55e" class="series"/><text x="500" y="60" class="legend" fill="#22c55e">CWIST: 184520</text><polyline points="40,93.1" stroke="#3b82f6" class="series"/><text x="550" y="60" class="legend" fill="#3b82f6">Axum: 142110</text><polyline points="40,125.0" stroke="#ef4444" class="series"/><text x="600" y="60" class="legend" fill="#ef4444">Spring: 38920</text><text x="40" y="190" class="subtitle">Avg Latency (ms - Lower is better)</text><line x1="40" y1="255" x2="640" y2="255" class="axis"/><polyline points="40,255.0" stroke="#22c55e" class="series"/><text x="500" y="190" class="legend" fill="#22c55e">CWIST: 2.1</text><polyline points="40,251.3" stroke="#3b82f6" class="series"/><text x="550" y="190" class="legend" fill="#3b82f6">Axum: 2.8</text><polyline points="40,210.0" stroke="#ef4444" class="series"/><text x="600" y="190" class="legend" fill="#ef4444">Spring: 10.2</text><text x="40" y="320" class="subtitle">Peak RSS (KiB - Lower is better)</text><line x1="40" y1="385" x2="640" y2="385" class="axis"/><polyline points="40,385.0" stroke="#22c55e" class="series"/><text x="500" y="320" class="legend" fill="#22c55e">CWIST: 12480</text><polyline points="40,381.9" stroke="#3b82f6" class="series"/><text x="550" y="320" class="legend" fill="#3b82f6">Axum: 28640</text><polyline points="40,340.0" stroke="#ef4444" class="series"/><text x="600" y="320" class="legend" fill="#ef4444">Spring: 245000</text><text x="40" y="450" class="subtitle">Context Switches (Lower is better)</text><line x1="40" y1="515" x2="640" y2="515" class="axis"/><polyline points="40,515.0" stroke="#22c55e" class="series"/><text x="500" y="450" class="legend" fill="#22c55e">CWIST: 420</text><polyline points="40,510.3" stroke="#3b82f6" class="series"/><text x="550" y="450" class="legend" fill="#3b82f6">Axum: 1850</text><polyline points="40,470.0" stroke="#ef4444" class="series"/><text x="600" y="450" class="legend" fill="#ef4444">Spring: 14200</text></svg>
